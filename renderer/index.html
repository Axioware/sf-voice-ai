<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>SF Voice AI</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Title bar -->
  <div class="titlebar">
    <div class="titlebar-drag">
      <span class="app-icon">🎙</span>
      <span class="app-name">SF Voice AI</span>
    </div>
    <div class="titlebar-controls">
      <button class="tb-btn" id="btn-settings" title="Settings">⚙</button>
      <button class="tb-btn" id="btn-pin"      title="Always on top">📌</button>
      <button class="tb-btn" id="btn-min"      title="Minimize">─</button>
      <button class="tb-btn tb-close" id="btn-close" title="Hide">✕</button>
    </div>
  </div>

  <div class="app">

    <!-- ── MAIN VIEW ────────────────────────────────────────────────────── -->
    <div id="view-main" class="view active">

      <!-- Status bar -->
      <div class="status-bar">
        <div class="status-dot idle" id="status-dot"></div>
        <span class="status-text" id="status-text">Ready</span>
        <div class="status-right">
          <span class="timer hidden" id="call-timer">00:00</span>
          <span class="dg-badge" id="dg-badge">DG</span>
        </div>
      </div>

      <!-- Channel indicators -->
      <div class="channels" id="channels">
        <div class="channel-pill lead">
          <span class="ch-dot"></span>
          <span>Lead (speaker)</span>
        </div>
        <div class="channel-pill agent">
          <span class="ch-dot"></span>
          <span>Agent (mic)</span>
        </div>
      </div>

      <!-- Chat window -->
      <div class="chat-window" id="chat-window">
        <div class="chat-empty" id="chat-empty">
          <div class="chat-empty-icon">🎙</div>
          <p>Start a call to see the live conversation</p>
          <p class="chat-empty-sub">Lead and Agent voices will appear as separate chat bubbles</p>
        </div>
      </div>

      <!-- AI reply panel -->
      <div class="ai-panel" id="ai-panel">
        <div class="ai-panel-header">
          <span class="ai-label">✦ AI Suggestion</span>
          <div class="thinking hidden" id="thinking">
            <span></span><span></span><span></span>
          </div>
          <button class="icon-btn" id="copy-ai" title="Copy">⎘</button>
        </div>
        <div class="ai-body" id="ai-body">
          <span class="ai-placeholder">AI suggestions will appear here during the call</span>
        </div>
      </div>

      <!-- Call controls -->
      <div class="call-bar">
        <button class="btn-call idle" id="btn-call">
          <span class="call-icon">📞</span>
          <span id="call-label">Start Call</span>
        </button>
        <button class="icon-btn dim" id="btn-clear-chat" title="Clear chat">🗑</button>
      </div>

      <!-- Error banner -->
      <div class="error-banner hidden" id="error-banner">
        <span id="error-text"></span>
        <button id="error-dismiss">✕</button>
      </div>

      <div class="toast hidden" id="sf-toast">Saved to Salesforce ✓</div>

    </div>

    <!-- ── SETTINGS VIEW ─────────────────────────────────────────────────── -->
    <div id="view-settings" class="view">
      <div class="settings-header">
        <button class="back-btn" id="btn-back">← Back</button>
        <h2>Settings</h2>
      </div>
      <div class="settings-body">

        <section class="settings-section">
          <h3>API Keys</h3>
          <label>Deepgram API Key
            <div class="input-row">
              <input type="password" id="s-deepgram-key" placeholder="Enter Deepgram API key" autocomplete="off" />
              <button class="eye-btn" id="toggle-deepgram">👁</button>
              <button class="test-btn" id="test-deepgram">Test</button>
            </div>
            <span class="field-hint">Get yours at <a href="#" data-url="https://console.deepgram.com">console.deepgram.com</a></span>
            <span class="test-result" id="dg-test-result"></span>
          </label>
          <label>Anthropic API Key
            <div class="input-row">
              <input type="password" id="s-anthropic-key" placeholder="Enter Anthropic API key" autocomplete="off" />
              <button class="eye-btn" id="toggle-anthropic">👁</button>
              <button class="test-btn" id="test-anthropic">Test</button>
            </div>
            <span class="field-hint">Get yours at <a href="#" data-url="https://console.anthropic.com">console.anthropic.com</a></span>
            <span class="test-result" id="an-test-result"></span>
          </label>
        </section>

        <section class="settings-section">
          <h3>Audio</h3>
          <label>Lead Audio Device (speaker/output)
            <select id="s-audio-device"></select>
            <span class="field-hint">Select output monitor to capture lead voice</span>
          </label>
          <label>Language
            <select id="s-language">
              <option value="en-US">English (US)</option>
              <option value="en-GB">English (UK)</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="pt">Portuguese</option>
            </select>
          </label>
        </section>

        <section class="settings-section">
          <h3>AI System Prompt</h3>
          <label>
            <textarea id="s-system-prompt" rows="8"></textarea>
          </label>
          <button class="link-btn" id="reset-prompt">Reset to default</button>
        </section>

        <div class="settings-footer">
          <button class="btn-save" id="btn-save-settings">Save Settings</button>
          <span class="save-status" id="save-status"></span>
        </div>

      </div>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
